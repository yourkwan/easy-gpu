<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="../media/main.css" rel="stylesheet">
<title>Easy GPU Preview (mock)</title>
</head>
<body>
<div class="wrap">
<header class="topbar">
  <div class="brand">
    <span class="title">Easy GPU</span>
    <span class="subtitle" id="host-line">未配置服务器</span>
  </div>
  <div class="actions">
    <span class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">初始化…</span></span>
    <span class="countdown" id="countdown"></span>
    <button class="btn primary" id="btn-refresh">刷新</button>
    <button class="btn" id="btn-host">切换服务器</button>
    <button class="btn" id="btn-settings">设置</button>
  </div>
</header>
<div class="banner hidden" id="banner"></div>
<main id="content"></main>
<footer class="footer" id="footer"></footer>
</div>

<script>
  // 模拟 VS Code webview API
  window.acquireVsCodeApi = function () {
    return {
      postMessage: function (msg) {
        if (msg && msg.type === 'ready') {
          window.__easyGpuFeed && window.__easyGpuFeed();
        }
      },
      getState: function () { return undefined; },
      setState: function () {}
    };
  };

  // 主题模拟：?theme=dark 时按 VS Code 深色主题注入变量（真实 webview 由 VS Code 注入 body.vscode-dark）
  (function () {
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme !== 'dark') return;
    document.body.classList.add('vscode-dark');
    var root = document.documentElement.style;
    root.setProperty('--vscode-editor-background', '#1e1e1e');
    root.setProperty('--vscode-foreground', '#d4d4d4');
    root.setProperty('--vscode-descriptionForeground', 'rgba(212, 212, 212, 0.68)');
    root.setProperty('--vscode-panel-border', 'rgba(255, 255, 255, 0.14)');
    root.setProperty('--vscode-list-hoverBackground', 'rgba(255, 255, 255, 0.06)');
  })();
</script>
<script src="mock-data.js"></script>
<script src="../media/main.js"></script>
</body>
</html>
